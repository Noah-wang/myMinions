<svg width="1180" height="880" viewBox="0 0 1180 880" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f343d"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .sub { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .zone { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #2f343d; stroke-width: 2; }
      .soft { fill: #f8fafc; stroke: #9ca3af; stroke-width: 1.6; }
      .loop { fill: #ecfdf5; stroke: #059669; stroke-width: 2.4; }
      .main { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.2; }
      .cap  { fill: #fff7ed; stroke: #d97706; stroke-width: 1.8; }
      .dash { fill: none; stroke: #cbd5e1; stroke-width: 1.6; stroke-dasharray: 6 4; }
      .edge { stroke: #2f343d; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1180" height="880" fill="#ffffff"/>
  <text class="title" x="48" y="56">COROS Agent 架构图</text>
  <text class="sub" x="48" y="84">个人多能力 Agent 运行时。自然语言进主 Agent 循环，显式命令走快速通道。</text>

  <text class="zone" x="48" y="132">入口层</text>
  <rect class="box" x="48" y="146" width="520" height="66" rx="10"/>
  <text class="label" x="72" y="176">Discord Bot</text>
  <text class="small" x="72" y="197">src/bot/discord_bot.py · 读写全开</text>
  <rect class="box" x="612" y="146" width="520" height="66" rx="10"/>
  <text class="label" x="636" y="176">Web 控制台</text>
  <text class="small" x="636" y="197">src/api/web_server.py · 公开无认证 · 只读</text>

  <line class="edge" x1="308" y1="212" x2="308" y2="246" marker-end="url(#arrow)"/>
  <line class="edge" x1="872" y1="212" x2="872" y2="246" marker-end="url(#arrow)"/>

  <text class="zone" x="48" y="272">主控层 src/orchestrator.py</text>
  <rect class="main" x="48" y="286" width="1084" height="76" rx="12"/>
  <text class="label" x="72" y="316">优先级：!显式命令 → 图片附件 → 待答问题 → 自然语言</text>
  <text class="small" x="72" y="338">频道隔离 · 只读开关 · 会话隔离 · 工具表按权限裁剪</text>

  <line class="edge" x1="308" y1="362" x2="308" y2="404" marker-end="url(#arrow)"/>
  <line class="edge" x1="872" y1="362" x2="872" y2="404" marker-end="url(#arrow)"/>

  <rect class="box" x="48" y="404" width="520" height="72" rx="10"/>
  <text class="label" x="72" y="434">显式命令快速通道</text>
  <text class="small" x="72" y="456">!coros-pb 这类。绕过循环，直接执行，输出确定</text>

  <rect class="loop" x="612" y="404" width="520" height="72" rx="10"/>
  <text class="label" x="636" y="434">主 Agent 循环 src/ask.py</text>
  <text class="small" x="636" y="456">模型选工具 → 执行 → 结果回灌 → 再决定，最多 4 轮</text>

  <line class="edge" x1="308" y1="476" x2="308" y2="516" marker-end="url(#arrow)"/>
  <line class="edge" x1="872" y1="476" x2="872" y2="516" marker-end="url(#arrow)"/>

  <rect class="dash" x="48" y="516" width="1084" height="146" rx="12"/>
  <text class="zone" x="72" y="542">能力层 agents/ — 提供 text_commands（执行动作）和 read_tools（结构化取数）</text>
  <rect class="cap" x="72" y="556" width="336" height="86" rx="10"/>
  <text class="label" x="96" y="586">coros-report</text>
  <text class="small" x="96" y="608">LangGraph 报告 · 运动记录 · PB</text>
  <text class="small" x="96" y="628">RAG 问答 · 长期档案 · FIT 归档</text>
  <rect class="cap" x="424" y="556" width="332" height="86" rx="10"/>
  <text class="label" x="448" y="586">photo-memory</text>
  <text class="small" x="448" y="608">比赛照片 · 意图识别</text>
  <text class="small" x="448" y="628">检索由模型挑组 · 分组合并</text>
  <rect class="cap" x="772" y="556" width="336" height="86" rx="10"/>
  <text class="label" x="796" y="586">kitchen-assistant</text>
  <text class="small" x="796" y="608">B站菜谱 · 采购清单</text>
  <text class="small" x="796" y="628">库存 · 消耗 · 临期提醒</text>

  <line class="edge" x1="590" y1="662" x2="590" y2="700" marker-end="url(#arrow)"/>

  <text class="zone" x="48" y="726">运行时 src/runtime/ — 各能力共用</text>
  <rect class="soft" x="48" y="740" width="256" height="60" rx="10"/>
  <text class="label" x="72" y="766">conversation</text>
  <text class="small" x="72" y="786">JSONL 只追加 · 压缩是视图</text>
  <rect class="soft" x="324" y="740" width="256" height="60" rx="10"/>
  <text class="label" x="348" y="766">tools</text>
  <text class="small" x="348" y="786">工具循环 · 超时 · 结果截断</text>
  <rect class="soft" x="600" y="740" width="256" height="60" rx="10"/>
  <text class="label" x="624" y="766">rag</text>
  <text class="small" x="624" y="786">向量 · BM25 · 父子块</text>
  <rect class="soft" x="876" y="740" width="256" height="60" rx="10"/>
  <text class="label" x="900" y="766">memory · atomic</text>
  <text class="small" x="900" y="786">长期记忆 · 写入-改名提交</text>

  <rect class="soft" x="48" y="820" width="520" height="42" rx="10"/>
  <text class="small" x="72" y="846">data/ 本地存储：记忆 · 会话日志 · 照片 · 知识库 · FIT</text>
  <rect class="soft" x="612" y="820" width="520" height="42" rx="10"/>
  <text class="small" x="636" y="846">外部：COROS MCP（固定版本）· DeepSeek · 嵌入 API · B站字幕</text>
</svg>
