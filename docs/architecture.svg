  <text x="42" y="54" class="title">AgentDeck 架构图</text>
  <text x="44" y="82" class="small">个人多能力 Agent 运行时：Discord 交互、COROS 报告、RAG 训练问答、后厨助手、记忆、调度器和评测体系。</text>

  <rect x="34" y="112" width="214" height="322" rx="18" fill="#ffffff" stroke="#111827" stroke-width="2.2" stroke-dasharray="6 7"/>
  <text x="78" y="406" class="section">交互层</text>

  <rect x="64" y="146" width="154" height="58" class="box"/>
