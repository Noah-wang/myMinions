<svg width="1180" height="760" viewBox="0 0 1180 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e7e9ee" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f343d"/>
    </marker>
    <marker id="softArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .section { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #2f343d; stroke-width: 2.2; rx: 10; }
      .soft { fill: #f8fafc; stroke: #6b7280; stroke-width: 1.7; rx: 10; }
      .agent { fill: #eef6ff; stroke: #2563eb; stroke-width: 2.2; rx: 12; }
      .cap { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.2; rx: 12; }
      .data { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.2; rx: 12; }
      .external { fill: #faf5ff; stroke: #9333ea; stroke-width: 2.2; rx: 12; }
      .eval { fill: #fefce8; stroke: #ca8a04; stroke-width: 2.2; rx: 12; }
      .line { stroke: #2f343d; stroke-width: 2.2; marker-end: url(#arrow); }
      .softLine { stroke: #6b7280; stroke-width: 1.8; marker-end: url(#softArrow); }
      .dash { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 6 7; fill: none; }
    </style>
  </defs>

  <rect width="1180" height="760" fill="#fbfcfe"/>
