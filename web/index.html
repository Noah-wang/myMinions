<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgentDeck</title>
    <link rel="icon" type="image/png" href="/assets/agentdeck-avatar.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <img src="/assets/agentdeck-avatar.png" alt="">
        </span>
        <h1>AgentDeck</h1>
      </div>
      <nav class="topnav">
        <a href="/" class="active" aria-current="page">对话</a>
        <a href="/data">数据</a>
        <a href="/tech">技术</a>
      </nav>
    </header>

    <main class="workspace">
      <aside class="rail" aria-label="对话列表">
        <button type="button" id="newChat" class="new-thread-button">新建对话</button>
        <div class="conversation-list" id="conversationList"></div>
      </aside>

      <section class="chat-shell">
        <div class="stage">
          <div class="thread" id="chatLog" aria-live="polite">
            <section class="welcome" id="welcome">
              <h2>AgentDeck</h2>
              <p>这个网页可以查询运动、照片、菜谱和知识库数据；写入操作只在 Discord 里开放。</p>
            </section>
          </div>
        </div>

        <section class="composer-suggestions" aria-label="快捷问题">
          <div class="suggestions" id="suggestions"></div>
        </section>

        <form class="composer" id="chatForm">
          <label class="sr-only" for="messageInput">消息</label>
          <textarea
            id="messageInput"
            rows="1"
            placeholder="输入问题，或点击上方快捷问题填入……"
            autocomplete="off"
          ></textarea>
          <button type="submit" id="sendButton" aria-label="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M4 12h13M12 5l7 7-7 7" fill="none" stroke="currentColor"
                    stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
